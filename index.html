<script>
// --- CONFIGURACIÓN DE CREDENCIALES ---
const AIRTABLE_BASE_ID = 'pat0s6qOv6jzw2Tsg'; 
const AIRTABLE_API_TOKEN = 'pat0s6qOv6jzw2Tsg.478eb4b67b0c016fb049064eda844089bb7d6d9b020b119e0de181eafa63b1f0'; 
const AIRTABLE_TABLE_NAME = 'Propiedades';

// --- CONFIGURACIÓN DE COLORES (Formato Hexadecimal) ---
// El primer valor es el color, el segundo número (0.4) es la opacidad/transparencia (de 0 a 1)
const configuracionEstatus = {
    "Disponible": { color: "#2ecc71", opacidad: 0.4 }, // Verde
    "Apartado":   { color: "#f1c40f", opacidad: 0.5 }, // Amarillo
    "Vendido":    { color: "#e74c3c", opacidad: 0.6 }  // Rojo
};

// --- FUNCIÓN QUE CONECTA CON AIRTABLE ---
async function consultarAirtableYActualizar() {
    const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_NAME}`;
    
    try {
        const respuesta = await fetch(url, {
            headers: {
                'Authorization': `Bearer ${AIRTABLE_API_TOKEN}`
            }
        });
        
        if (!respuesta.ok) throw new Error("Error en la petición a Airtable");
        
        const datos = await respuesta.json();
        
        // Procesamos cada registro de la base de datos
        datos.records.forEach(registro => {
            const campos = registro.fields;
            const idHotspot = campos.ID_Hotspot;
            const estatusPropiedad = campos.Estatus;
            
            // Si el lote tiene un estatus válido asignado, aplicamos los cambios
            if (idHotspot && estatusPropiedad && configuracionEstatus[estatusPropiedad]) {
                const infoVisual = configuracionEstatus[estatusPropiedad];
                
                // Llamamos a la API interna de 3DVista para modificar el polígono
                // Nota: Asegúrate de que el objeto global del tour esté accesible (comúnmente 'vtour')
                if (typeof vtour !== 'undefined') {
                    // Cambiamos el color de fondo y su opacidad en tiempo real
                    vtour.setHotspotColor(idHotspot, infoVisual.color, infoVisual.opacidad);
                    
                    // Opcional: Cambiar también el color del borde del polígono si lo deseas
                    vtour.setHotspotBorderColor(idHotspot, infoVisual.color, 0.8);
                }
            }
        });
        
    } catch (error) {
        console.error("Hubo un problema al actualizar los hotspots:", error);
    }
}

// --- ACTIVACIÓN AUTOMÁTICA AL CARGAR EL TOUR ---
// 3DVista expone un evento nativo cuando el tour interactivo está listo en el navegador
window.on3DVistaLoad = function() {
    // Ejecutamos la consulta inmediatamente al cargar
    consultarAirtableYActualizar();
    
    // Opcional: Si quieres que el tour se actualice solo cada 60 segundos sin recargar la página:
    // setInterval(consultarAirtableYActualizar, 60000);
};
</script>
