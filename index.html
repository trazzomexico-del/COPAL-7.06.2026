<script src="https://code.google.com/p/crypto-js/"></script> <script>
(function() {
    var checarVisor = setInterval(function() {
        var visor = window.eTour || (window.tdvplayer ? window.tdvplayer.getTour() : null);
        if (visor) {
            clearInterval(checarVisor);
            console.log("¡Visor detectado por bypass externo! Conectando inventario...");
            
            var sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaK8eKnkhhQ8Culv1_Z8VlQPDUFd2hvfpLnoBBA_3izrjXZ2TjvbB7WT1DJXaazr7q6KU3ghXi6mlv/pub?output=csv';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', sheetUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var filas = xhr.responseText.split('\r').join('').split('\n');
                    var actualizados = 0;
                    
                    for (var i = 1; i < filas.length; i++) {
                        var fila = filas[i].trim();
                        if (fila !== '') {
                            var columnas = fila.split(',');
                            if (columnas.length >= 3) {
                                var id = columnas[0].replace(/['"]+/g, '').trim();
                                var status = columnas[2].replace(/['"]+/g, '').trim().toLowerCase();
                                
                                var hs = visor.getComponent('lote_' + id);
                                if (!hs) {
                                    var idConCero = id.padStart(2, '0');
                                    hs = visor.getComponent('lote_' + idConCero);
                                }
                                
                                if (hs) {
                                    hs.set('visible', true);
                                    actualizados++;
                                    if (status === 'vendido') {
                                        hs.set('color', '#ff0000');
                                        hs.set('alpha', 0.6);
                                    } else if (status === 'disponible') {
                                        hs.set('color', '#00ff00');
                                        hs.set('alpha', 0.4);
                                    }
                                }
                            }
                        }
                    }
                    console.log("Inventario sincronizado. Lotes mapeados con éxito: " + actualizados);
                }
            };
            xhr.send();
        }
    }, 500);
})();
</script>
