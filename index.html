<script>
// --- CONFIGURACIÓN DE CREDENCIALES INTEGRADAS ---
const AIRTABLE_BASE_ID = 'pat0s6qOv6jzw2Tsg'; 
const AIRTABLE_API_TOKEN = 'pat0s6qOv6jzw2Tsg.478eb4b67b0c016fb049064eda844089bb7d6d9b020b119e0de181eafa63b1f0'; 
const AIRTABLE_TABLE_NAME = 'Propiedades';

// --- CONFIGURACIÓN DE COLORES PARA LOS LOTES ---
// Puedes ajustar los colores (HEX) y la opacidad (de 0 a 1) según tu diseño
const configuracionEstatus = {
    "Disponible": { color: "#2ecc71", opacidad: 0.4 }, // Verde translúcido
    "Apartado":   { color: "#f1c40f", opacidad: 0.5 }, // Amarillo translúcido
    "Vendido":    { color: "#e74c3c", opacidad: 0.6 }  // Rojo translúcido
};

async function consultarAirtableYActualizar() {
    // 1. Detectamos el reproductor de 3DVista (vtour o tdvplayer)
    const player = window.vtour || (window.tdvplayer ? window.tdvplayer.getPlayer() : null);
    
    // Si el mapa interactivo en pantalla aún no termina de cargar, esperamos la siguiente vuelta
    if (!player || typeof player.setHotspotColor !== 'function') {
        console.log("Esperando a que el mapa interactivo de 3DVista esté listo...");
        return; 
    }

    const urlOficial = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_NAME}`;

    try {
        // 2. Realizamos la consulta segura a tu base de Airtable
        const respuesta = await fetch(urlOficial, {
            headers: { 'Authorization': `Bearer ${AIRTABLE_API_TOKEN}` }
        });
        
        if (!respuesta.ok) throw new Error("Error al conectar con la API de Airtable. Revisa el nombre de la tabla.");
        
        const datos = await respuesta.json();
        console.log("Datos recibidos de Airtable con éxito:", datos.records);
        
        // 3. Recorremos los registros para pintar los polígonos
        datos.records.forEach(registro => {
            const campos = registro.fields;
            const idHotspot = campos.ID_Hotspot; // Columna con el nombre del lote en 3DVista
            const estatusPropiedad = campos.Estatus; // Columna con el estatus (Disponible, Vendido, etc.)
            
            // Si el lote coincide con la configuración de color, lo pintamos
            if (idHotspot && estatusPropiedad && configuracionEstatus[estatusPropiedad]) {
                const infoVisual = configuracionEstatus[estatusPropiedad];
                
                // Aplicamos el color de relleno y del borde al polígono en tiempo real
                player.setHotspotColor(idHotspot, infoVisual.color, infoVisual.opacidad);
                player.setHotspotBorderColor(idHotspot, infoVisual.color, 0.8);
            }
        });

        // Una vez que se pintan con éxito, detenemos el bucle para no saturar la red
        clearInterval(revisorCargaTour);
        console.log("¡Polígonos de Copal actualizados correctamente desde Airtable!");

    } catch (error) {
        console.error("Error en la sincronización con Airtable:", error);
    }
}

// Revisar de forma segura cada 1.5 segundos si el mapa ya cargó para inyectar los datos
const revisorCargaTour = setInterval(consultarAirtableYActualizar, 1500);
</script>
