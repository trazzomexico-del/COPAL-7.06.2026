<script>
function iniciarProcesoDisponibilidad() {
    var sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaK8eKnkhhQ8Culv1_Z8VlQPDUFd2hvfpLnoBBA_3izrjXZ2TjvbB7WT1DJXaazr7q6KU3ghXi6mlv/pub?output=csv';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', sheetUrl, true);
    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            console.log("¡Éxito! Conectado a Google Sheets.");
            
            // Detectamos si el visor de 3DVista ya está completamente activo en la memoria global
            var visor = window.eTour || (window.tdvplayer ? window.tdvplayer.getTour() : null);
            
            // SI EL VISOR NO ESTÁ LISTO, ESPERAMOS 1 SEGUNDO Y REINTENTAMOS LA FUNCIÓN COMPLETA
            if (!visor) {
                console.log("El visor de 3DVista sigue cargando... reintentando en 1 segundo.");
                setTimeout(iniciarProcesoDisponibilidad, 1000);
                return;
            }
            
            // Si ya está listo, procesamos los lotes
            var filas = xhr.responseText.split('\r').join('').split('\n');
            var lotesPintados = 0;

            for (var i = 1; i < filas.length; i++) {
                var fila = filas[i].trim();
                if (fila !== '') {
                    var columnas = fila.split(',');
                    if (columnas.length >= 3) {
                        var id = columnas[0].replace(/['"]+/g, '').trim();
                        var status = columnas[2].replace(/['"]+/g, '').trim().toLowerCase();
                        
                        // Formato de nombre estándar (ej: lote_1)
                        var nombreHotspot = 'lote_' + id;
                        var hs = visor.getComponent(nombreHotspot);
                        
                        // Si no lo encuentra, prueba con el formato de dos dígitos (ej: lote_01)
                        if (!hs) {
                            var idConCero = id.padStart(2, '0');
                            nombreHotspot = 'lote_' + idConCero;
                            hs = visor.getComponent(nombreHotspot);
                        }
                        
                        if (hs) {
                            hs.set('visible', true);
                            lotesPintados++;
                            if (status === 'vendido') {
                                hs.set('color', '#ff0000'); // Rojo
                                hs.set('alpha', 0.6);
                            } else if (status === 'disponible') {
                                hs.set('color', '#00ff00'); // Verde
                                hs.set('alpha', 0.4);
                            }
                        }
                    }
                }
            }
            console.log("Proceso terminado. Se actualizaron visualmente " + lotesPintados + " lotes.");
        }
    };
    xhr.send();
}

// Arrancamos el intento inicial en cuanto carga el documento base
window.addEventListener('load', function() {
    setTimeout(iniciarProcesoDisponibilidad, 2000);
});
</script>
