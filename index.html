<script>
// --- CONFIGURACIÓN DE CREDENCIALES ---
const AIRTABLE_BASE_ID = 'pat0s6qOv6jzw2Tsg'; 
const AIRTABLE_API_TOKEN = 'pat0s6qOv6jzw2Tsg.478eb4b67b0c016fb049064eda844089bb7d6d9b020b119e0de181eafa63b1f0'; 
const AIRTABLE_TABLE_NAME = 'Propiedades';

const configuracionEstatus = {
    "Disponible": { color: "#2ecc71", opacidad: 0.4 }, // Verde
    "Apartado":   { color: "#f1c40f", opacidad: 0.5 }, // Amarillo
    "Vendido":    { color: "#e74c3c", opacidad: 0.6 }  // Rojo
};

async function consultarAirtableYActualizar() {
    // 1. Buscamos el reproductor en todas las variables posibles que usa 3DVista
    let player = null;
    
    if (typeof window.vtour !== 'undefined') {
        player = window.vtour;
    } else if (typeof window.tdvplayer !== 'undefined' && typeof window.tdvplayer.getPlayer === 'function') {
        player = window.tdvplayer.getPlayer();
    } else if (window.panoramas && window.panoramas.getPlayer) {
        player = window.panoramas.getPlayer();
    }

    // Si aún no encontramos la función para pintar los hotspots, seguimos esperando
    if (!player || (typeof player.setHotspotColor !== 'function' && typeof player.setProp !== 'function')) {
        console.log("Buscando el motor de 3DVista en el mapa...");
        return; 
    }

    // Si llegamos aquí, ¡ya encontramos el reproductor! Frenamos el bucle de espera
    clearInterval(revisorCargaTour);
    console.log("¡Conexión establecida con 3DVista! Conectando a Airtable...");

    const urlOficial = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_NAME}`;

    try {
        const respuesta = await fetch(urlOficial, {
            headers: { 'Authorization': `Bearer ${AIRTABLE_API_TOKEN}` }
        });
        
        if (!respuesta.ok) throw new Error("Error en la respuesta de Airtable. Verifica el nombre de la tabla.");
        
        const datos = await respuesta.json();
        console.log("Datos exitosos de Airtable:", datos.records);
        
        datos.records.forEach(registro => {
            const campos = registro.fields;
            const idHotspot = campos.ID_Hotspot; 
            const estatusPropiedad = campos.Estatus; 
            
            if (idHotspot && estatusPropiedad && configuracionEstatus[estatusPropiedad]) {
                const infoVisual = configuracionEstatus[estatusPropiedad];
                
                // Intentar pintar usando los dos métodos estándar de la API de 3DVista
                try {
                    if (typeof player.setHotspotColor === 'function') {
                        player.setHotspotColor(idHotspot, infoVisual.color, infoVisual.opacidad);
                        player.setHotspotBorderColor(idHotspot, infoVisual.color, 0.8);
                    } else if (typeof player.setProp === 'function') {
                        // Alternativa nativa para ciertos tipos de skins/hotspots
                        player.setProp(idHotspot, "backgroundColor", infoVisual.color);
                        player.setProp(idHotspot, "backgroundAlpha", infoVisual.opacidad);
                    }
                } catch (errHotspot) {
                    console.log(`No se pudo pintar el hotspot: ${idHotspot}. Revisa que el nombre coincida.`);
                }
            }
        });

        console.log("¡Sincronización completa!");

    } catch (error) {
        console.error("Error al mapear Airtable:", error);
    }
}

// Revisar cada 1.5 segundos hasta romper el ciclo al conectar
const revisorCargaTour = setInterval(consultarAirtableYActualizar, 1500);
</script>
